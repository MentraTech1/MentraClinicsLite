<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <title>MentraClinicsLite - بوابة دخول العيادة</title>
    <link rel="manifest" href="manifest.json">
    <!-- تحسين التحميل: preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="icon" href="assets/logo.png">
    <!-- خط Cairo -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">

    <!-- Tailwind CSS -->
    <script src="assets/Tailwind.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="assets/react.production.min.js"></script>
    <script crossorigin src="assets/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="assets/babel.min.js"></script>
    
    <!-- Dexie.js -->
    <script src="assets/dexie.min.js"></script>
    
    <!-- ملف قاعدة البيانات الموحد -->
    <script src="database.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #0F172A; /* خلفية داكنة احترافية */
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* تأثيرات الخلفية المتحركة (ألوان طبية) */
        .bg-shapes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: float 20s infinite alternate; }
        .shape-1 { background: #0284C7; width: 400px; height: 400px; top: -100px; right: -100px; } /* Sky Blue */
        .shape-2 { background: #0EA5E9; width: 300px; height: 300px; bottom: -50px; left: -50px; animation-delay: -5s; }
        
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, 50px) scale(1.1); } }

        /* تخصيص حقول الإدخال */
        .input-group { position: relative; transition: all 0.3s ease; }
        .input-field {
            width: 100%; padding: 1rem 1rem 1rem 3rem; border-radius: 1rem;
            border: 2px solid #E2E8F0; background: #F8FAFC; outline: none;
            color: #1E293B; font-weight: 700; transition: all 0.3s ease;
        }
        .input-field:focus { border-color: #0EA5E9; background: #FFFFFF; box-shadow: 0 4px 20px rgba(14, 165, 233, 0.15); }
        .input-icon { position: absolute; top: 50%; left: 1.25rem; transform: translateY(-50%); color: #94A3B8; transition: all 0.3s ease; }
        .input-field:focus ~ .input-icon { color: #0EA5E9; }
        
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
	
	    <!-- زر الرجوع للصفحة الرئيسية -->
    <a href="index.html" class="absolute top-6 left-6 z-50 flex items-center gap-2 text-white/70 hover:text-white transition-colors text-sm font-bold bg-white/5 hover:bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/10">
        <i class="fas fa-arrow-left"></i> الرئيسية
    </a>

    <!-- شاشة تحميل سريعة تظهر فوراً -->
    <style>
        #sub-loader {
            position:fixed;inset:0;background:#0F172A;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            z-index:9999;transition:opacity 0.4s ease;
        }
        #sub-loader.hidden{opacity:0;pointer-events:none;}
        .sub-spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#0EA5E9;border-radius:50%;animation:spin2 0.8s linear infinite;}
        @keyframes spin2{to{transform:rotate(360deg);}}
    </style>
    <div id="sub-loader">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,#0284C7,#0EA5E9);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 25px rgba(14,165,233,0.4)">
            <i class="fas fa-stethoscope text-white text-2xl"></i>
        </div>
        <div class="sub-spinner"></div>
        <p style="margin-top:14px;font-family:system-ui,sans-serif;font-weight:700;color:#94A3B8;font-size:13px">MentraClinicsLite جاري التحميل...</p>
    </div>
    <script>
        var subLoader = document.getElementById("sub-loader");
        document.addEventListener("DOMContentLoaded", function() {
            var root = document.getElementById("root");
            if (!root) return;
            var subObs = new MutationObserver(function(){
                if(root.children.length > 0){
                    subLoader.classList.add("hidden");
                    setTimeout(function(){subLoader.remove();},500);
                    subObs.disconnect();
                }
            });
            subObs.observe(root, {childList:true});
        });
    </script>
    
    <div id="root" class="relative z-10 flex items-center justify-center min-h-screen p-4 sm:p-6"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function SubscriptionsApp() {
            const [isChecking, setIsChecking] = useState(true);
            const [activeTab, setActiveTab] = useState('login'); 
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            // حالات تسجيل الدخول السريع
            const [savedUsers, setSavedUsers] = useState([]);
            const [selectedSavedUser, setSelectedSavedUser] = useState(null);
            const [fastLoginPassword, setFastLoginPassword] = useState('');

            // تم تغيير email إلى phone بناءً على قاعدة بيانات العيادات
            const [formData, setFormData] = useState({
                clinicName: '', ownerName: '', phone: '', password: ''
            });

            // التحقق من الجلسة وتهيئة قاعدة البيانات
            useEffect(() => {
                const initApp = async () => {
                    try {
                        // 1. الدخول التلقائي: إذا كان مسجل دخول بالفعل
                        const activeSession = localStorage.getItem('MentraClinics_Session');
                        if (activeSession) {
                            window.location.replace('dashboard.html');
                            return;
                        }

                        // تهيئة قاعدة البيانات
                        if(window.initDatabase) await window.initDatabase();

                        // 2. الدخول السريع: البحث عن المستخدمين
                        const users = await window.db.users.toArray();
                        if (users && users.length > 0) {
                            let enrichedUsers = [];
                            
                            // جلب اسم العيادة (في النسخة المحلية العيادة واحدة)
                            const clinic = await window.db.clinic_info.toCollection().first();
                            const clinicName = clinic ? clinic.clinic_name : "عيادتي";

                            for (let u of users) {
                                enrichedUsers.push({ ...u, clinic_name: clinicName });
                            }

                            if (enrichedUsers.length > 0) {
                                setSavedUsers(enrichedUsers);
                                
                                // تحديد آخر مستخدم كافتراضي
                                const lastUserId = localStorage.getItem('MentraClinics_LastUserID');
                                const defaultUser = enrichedUsers.find(u => u.id == lastUserId) || enrichedUsers[enrichedUsers.length - 1];
                                
                                setSelectedSavedUser(defaultUser);
                                setActiveTab('fast-login');
                            }
                        }

                        setTimeout(() => setIsChecking(false), 800);
                    } catch (err) {
                        console.error("خطأ في التهيئة:", err);
                        setIsChecking(false);
                    }
                };
                initApp();
            }, []);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
                setError('');
            };

            // تسجيل الدخول العادي
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    const { user, clinic } = await window.ClinicQueries.login(formData.phone, formData.password);
                    
                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: user.id, clinic_id: clinic.id, name: user.name, role: user.role, clinic_name: clinic.clinic_name
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', user.id);
                    
                    window.location.replace('dashboard.html');
                } catch (err) {
                    setError(err.message || "حدث خطأ غير متوقع");
                    setLoading(false);
                }
            };

            // تسجيل الدخول السريع (بإدخال الباسورد فقط)
            const handleFastLogin = async (e) => {
                e.preventDefault();
                if (!selectedSavedUser) return;
                if (!fastLoginPassword) {
                    setError("الرجاء إدخال كلمة المرور");
                    return;
                }

                setLoading(true); setError('');
                try {
                    const { user, clinic } = await window.ClinicQueries.login(selectedSavedUser.phone, fastLoginPassword);
                    
                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: user.id, clinic_id: clinic.id, name: user.name, role: user.role, clinic_name: clinic.clinic_name
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', user.id);
                    
                    window.location.replace('dashboard.html');
                } catch (err) {
                    setError("كلمة المرور غير صحيحة");
                    setLoading(false);
                }
            };

            // إنشاء عيادة جديدة
            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    const { clinicId, userId } = await window.ClinicQueries.createClinic(
                        formData.clinicName, formData.ownerName, formData.phone, formData.password
                    );

                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: userId, clinic_id: clinicId, name: formData.ownerName, role: 'owner', clinic_name: formData.clinicName
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', userId);
                    
                    window.location.replace('dashboard.html');
                } catch (err) {
                    setError(err.message || "حدث خطأ غير متوقع");
                    setLoading(false);
                }
            };

            // شاشة التحميل الأولية
            if (isChecking) {
                return (
                    <div className="flex flex-col items-center justify-center fade-up">
                        <div className="w-20 h-20 bg-gradient-to-br from-[#0284C7] to-[#0EA5E9] rounded-2xl flex items-center justify-center text-white text-4xl shadow-[0_0_40px_rgba(14,165,233,0.4)] animate-pulse mb-6">
                            <i className="fas fa-stethoscope"></i>
                        </div>
                        <h2 className="text-2xl font-black text-white tracking-wide">Mentra<span className="text-[#0EA5E9]">Clinics                     <span class="bg-slate-200 text-slate-700 text-[10px] md:text-[10px] font-black px-1.5 py-0.5 rounded ml-1 shrink-0">LITE</span></span></h2>
                        <p className="text-slate-400 font-bold text-sm mt-2">جاري فحص حالة الحساب...</p>
                    </div>
                );
            }

            return (
                <div className="w-full max-w-[420px] fade-up">
                    
                    {/* الشعار والنصوص الترحيبية */}
                    <div className="text-center mb-8">
                        <div className="w-16 h-16 bg-gradient-to-br from-[#0284C7] to-[#0EA5E9] mx-auto rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg shadow-sky-600/20 mb-4 transform transition hover:scale-105">
                            <i className="fas fa-stethoscope"></i>
                        </div>
                        <h1 className="text-3xl font-black text-white tracking-tight mb-1">Mentra<span className="text-[#0EA5E9]">Clinics                     <span class="bg-slate-200 text-slate-700 text-[15px] md:text-[10px] font-black px-1.5 py-0.5 rounded ml-1 shrink-0">LITE</span></span></h1>
                        <span className="inline-block bg-white/10 text-slate-300 backdrop-blur-md border border-white/20 px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase mt-2">
                            <i className="fas fa-shield-alt text-emerald-400 mr-1"></i> Offline Medical Edition
                        </span>
                    </div>

                    {/* البطاقة الرئيسية */}
                    <div className="bg-white rounded-[2rem] shadow-2xl overflow-hidden relative border border-slate-100">
                        
                        {/* نظام التبويبات */}
                        {activeTab !== 'fast-login' && (
                            <div className="flex p-2 bg-slate-50 border-b border-slate-100">
                                <button 
                                    onClick={() => {setActiveTab('login'); setError('');}} 
                                    className={`flex-1 py-3 text-sm font-black rounded-xl transition-all duration-300 ${activeTab === 'login' ? 'bg-white text-[#0284C7] shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    دخول للعيادة
                                </button>
                                <button 
                                    onClick={() => {setActiveTab('register'); setError('');}} 
                                    className={`flex-1 py-3 text-sm font-black rounded-xl transition-all duration-300 ${activeTab === 'register' ? 'bg-white text-[#0284C7] shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    تأسيس عيادة جديدة
                                </button>
                            </div>
                        )}

                        <div className="p-6 sm:p-8">
                            
                            {/* رسالة الخطأ */}
                            {error && (
                                <div className="bg-rose-50 border border-rose-200 text-rose-600 p-4 rounded-2xl text-xs font-bold mb-6 flex items-start gap-3 fade-up">
                                    <i className="fas fa-exclamation-circle text-lg mt-0.5"></i>
                                    <span className="leading-relaxed">{error}</span>
                                </div>
                            )}

                            {/* ====== نموذج الدخول السريع (اختيار الحساب وإدخال الباسورد) ====== */}
                            {activeTab === 'fast-login' && selectedSavedUser && (
                                <form onSubmit={handleFastLogin} className="text-center fade-up space-y-5">
                                    
                                    {savedUsers.length > 1 && (
                                        <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2 mb-2 justify-center">
                                            {savedUsers.map(u => (
                                                <button 
                                                    key={u.id} type="button"
                                                    onClick={() => { setSelectedSavedUser(u); setFastLoginPassword(''); setError(''); }}
                                                    className={`p-2 rounded-2xl border-2 transition-all shrink-0 w-20 flex flex-col items-center ${selectedSavedUser.id === u.id ? 'border-[#0EA5E9] bg-sky-50/50 scale-105' : 'border-slate-100 bg-white opacity-60 hover:opacity-100'}`}
                                                >
                                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black mb-1.5 transition-colors ${selectedSavedUser.id === u.id ? 'bg-[#0284C7] text-white' : 'bg-slate-200 text-slate-500'}`}>
                                                        {u.name.charAt(0)}
                                                    </div>
                                                    <p className="text-[9px] font-bold text-slate-700 whitespace-nowrap truncate w-full px-1">{u.role === 'owner' ? 'د.' : ''} {u.name.split(' ')[0]}</p>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="mb-2">
                                        {savedUsers.length === 1 && (
                                            <div className="w-20 h-20 bg-[#0284C7] text-white rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-4 border-4 border-slate-50 shadow-lg">
                                                {selectedSavedUser.name.charAt(0)}
                                            </div>
                                        )}
                                        <h2 className="text-xl font-black text-slate-800">أهلاً بك، {selectedSavedUser.name.split(' ')[0]}</h2>
                                        <p className="text-sm font-bold text-[#0EA5E9] mt-1"><i className="fas fa-clinic-medical mr-1"></i> {selectedSavedUser.clinic_name}</p>
                                    </div>

                                    <div className="input-group relative text-right">
                                        <input type={showPassword ? "text" : "password"} value={fastLoginPassword} onChange={(e) => setFastLoginPassword(e.target.value)} required dir="ltr" className="input-field text-left placeholder:text-right pr-12" placeholder="أدخل كلمة المرور" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-[#0EA5E9] transition-colors focus:outline-none">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>

                                    <button type="submit" disabled={loading} className="w-full bg-[#0284C7] hover:bg-sky-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-sky-700/20 transition-all flex justify-center items-center gap-2 text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <><i className="fas fa-sign-in-alt"></i> تأكيد الدخول</>}
                                    </button>
                                    
                                    <button type="button" onClick={() => setActiveTab('login')} className="w-full text-slate-500 hover:text-slate-800 font-bold text-sm transition-colors mt-2 pb-2">
                                        الدخول بحساب غير محفوظ
                                    </button>
                                </form>
                            )}

                            {/* ====== نموذج تسجيل الدخول العادي ====== */}
                            {activeTab === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-5 fade-up">
                                    <div className="input-group">
                                        <input type="tel" name="phone" value={formData.phone} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right" placeholder="رقم الهاتف" />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group relative">
                                        <input type={showPassword ? "text" : "password"} name="password" value={formData.password} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right pr-12" placeholder="كلمة المرور" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-[#0EA5E9] transition-colors focus:outline-none">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-[#0284C7] hover:bg-sky-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-sky-700/20 transition-all mt-2 flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'دخول للعيادة'}
                                    </button>
                                    {savedUsers.length > 0 && (
                                        <button type="button" onClick={() => setActiveTab('fast-login')} className="w-full text-center text-slate-500 hover:text-slate-800 font-bold text-sm transition-colors pt-2">
                                            <i className="fas fa-bolt text-[#0EA5E9] mr-1"></i> العودة لقائمة الحسابات المحفوظة
                                        </button>
                                    )}
                                </form>
                            )}

                            {/* ====== نموذج إنشاء عيادة ====== */}
                            {activeTab === 'register' && (
                                <form onSubmit={handleRegister} className="space-y-4 fade-up">
                                    <div className="input-group">
                                        <input type="text" name="clinicName" value={formData.clinicName} onChange={handleChange} required className="input-field pr-4" placeholder="اسم العيادة / المركز الطبي" />
                                        <i className="fas fa-clinic-medical input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="text" name="ownerName" value={formData.ownerName} onChange={handleChange} required className="input-field pr-4" placeholder="اسم الطبيب المدير" />
                                        <i className="fas fa-user-md input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="tel" name="phone" value={formData.phone} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right" placeholder="رقم الهاتف الأساسي للعيادة" />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group relative">
                                        <input type={showPassword ? "text" : "password"} name="password" value={formData.password} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right pr-12" placeholder="كلمة المرور (6 أحرف على الأقل)" minLength="6" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-[#0EA5E9] transition-colors focus:outline-none">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-gradient-to-l from-[#0284C7] to-[#0EA5E9] hover:to-sky-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-sky-500/30 transition-all mt-2 flex justify-center items-center gap-2 disabled:opacity-70 text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'تأسيس العيادة وبدء العمل'}
                                    </button>
                                </form>
                            )}

                        </div>
                        
                        {/* تذييل البطاقة لحماية الخصوصية */}
                        <div className="bg-slate-50 p-4 text-center border-t border-slate-100">
                            <p className="text-[11px] font-bold text-slate-400 flex items-center justify-center gap-2">
                                <i className="fas fa-lock text-emerald-500"></i> بيانات المرضى والعيادة مشفرة على جهازك فقط
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SubscriptionsApp />);
    </script>
</body>
</html>

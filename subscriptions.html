<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <title>MentraClinicsLite - بوابة دخول العيادة</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="icon" href="assets/logo.png">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
    <script src="assets/Tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script crossorigin src="assets/react.production.min.js"></script>
    <script crossorigin src="assets/react-dom.production.min.js"></script>
    <script src="assets/babel.min.js"></script>
    <script src="assets/dexie.min.js"></script>
    <script src="database.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #0F172A; 
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent; /* إزالة الوميض عند اللمس في الأندرويد */
        }
        
        .bg-shapes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: float 20s infinite alternate; }
        .shape-1 { background: #0284C7; width: 400px; height: 400px; top: -100px; right: -100px; }
        .shape-2 { background: #0EA5E9; width: 300px; height: 300px; bottom: -50px; left: -50px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, 50px) scale(1.1); } }

        .input-group { position: relative; transition: all 0.3s ease; }
        .input-field {
            width: 100%; padding: 1.1rem 1.1rem 1.1rem 3rem; border-radius: 1rem;
            border: 2px solid #E2E8F0; background: #F8FAFC; outline: none;
            color: #1E293B; font-weight: 700; transition: all 0.3s ease;
            font-size: 16px; /* يمنع الزووم التلقائي في الموبايل */
        }
        .input-field:focus { border-color: #0EA5E9; background: #FFFFFF; box-shadow: 0 4px 20px rgba(14, 165, 233, 0.15); }
        .input-icon { position: absolute; top: 50%; left: 1.25rem; transform: translateY(-50%); color: #94A3B8; transition: all 0.3s ease; font-size: 1.1rem;}
        .input-field:focus ~ .input-icon { color: #0EA5E9; }

        /* تخصيص لون حقول الاستعادة */
        .input-field.recovery:focus { border-color: #8B5CF6; box-shadow: 0 4px 20px rgba(139, 92, 246, 0.15); }
        .input-field.recovery:focus ~ .input-icon { color: #8B5CF6; }
        
        /* سكرول بار مخصص للكارت في الشاشات الصغيرة */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-up { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
	
    <!-- زر الرجوع للصفحة الرئيسية -->
    <a href="index.html" class="absolute top-4 left-4 z-50 flex items-center gap-2 text-white/70 hover:text-white transition-colors text-sm font-bold bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/10 active:scale-95">
        <i class="fas fa-arrow-left"></i> الرئيسية
    </a>

    <!-- شاشة التحميل الأولية -->
    <style>
        #sub-loader {
            position:fixed;inset:0;background:#0F172A;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            z-index:9999;transition:opacity 0.4s ease;
        }
        #sub-loader.hidden{opacity:0;pointer-events:none;}
        .sub-spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#0EA5E9;border-radius:50%;animation:spin2 0.8s linear infinite;}
        @keyframes spin2{to{transform:rotate(360deg);}}
    </style>
    <div id="sub-loader">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,#0284C7,#0EA5E9);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 25px rgba(14,165,233,0.4)">
            <i class="fas fa-stethoscope text-white text-2xl"></i>
        </div>
        <div class="sub-spinner"></div>
    </div>
    <script>
        var subLoader = document.getElementById("sub-loader");
        document.addEventListener("DOMContentLoaded", function() {
            var root = document.getElementById("root");
            if (!root) return;
            var subObs = new MutationObserver(function(){
                if(root.children.length > 0){
                    subLoader.classList.add("hidden");
                    setTimeout(function(){subLoader.remove();},500);
                    subObs.disconnect();
                }
            });
            subObs.observe(root, {childList:true});
        });
    </script>
    
    <div id="root" class="relative z-10 flex items-center justify-center min-h-screen p-4 py-16 sm:p-6"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function SubscriptionsApp() {
            const [isChecking, setIsChecking] = useState(true);
            const [activeTab, setActiveTab] = useState('login'); // login | register | fast-login | recovery
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            // بيانات الدخول السريع
            const [savedUsers, setSavedUsers] = useState([]);
            const [selectedSavedUser, setSelectedSavedUser] = useState(null);
            const [fastLoginPassword, setFastLoginPassword] = useState('');

            // بيانات الدخول والتسجيل
            const [formData, setFormData] = useState({
                clinicName: '', ownerName: '', phone: '', password: ''
            });

            // بيانات استعادة الحساب
            const [recoveryData, setRecoveryData] = useState({
                key: '', newPhone: '', newPassword: ''
            });

            useEffect(() => {
                const initApp = async () => {
                    try {
                        const activeSession = localStorage.getItem('MentraClinics_Session');
                        if (activeSession) { window.location.replace('dashboard.html'); return; }

                        if(window.initDatabase) await window.initDatabase();

                        const users = await window.db.users.toArray();
                        if (users && users.length > 0) {
                            const clinic = await window.db.clinic_info.toCollection().first();
                            const clinicName = clinic ? clinic.clinic_name : "عيادتي";

                            let enrichedUsers = users.map(u => ({ ...u, clinic_name: clinicName }));
                            setSavedUsers(enrichedUsers);
                            
                            const lastUserId = localStorage.getItem('MentraClinics_LastUserID');
                            const defaultUser = enrichedUsers.find(u => u.id == lastUserId) || enrichedUsers[enrichedUsers.length - 1];
                            
                            setSelectedSavedUser(defaultUser);
                            setActiveTab('fast-login');
                        }
                        setTimeout(() => setIsChecking(false), 500);
                    } catch (err) {
                        console.error(err); setIsChecking(false);
                    }
                };
                initApp();
            }, []);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
                setError('');
            };

            const handleRecoveryChange = (e) => {
                setRecoveryData({ ...recoveryData, [e.target.name]: e.target.value });
                setError('');
            };

            // تسجيل الدخول
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    const { user, clinic } = await window.ClinicQueries.login(formData.phone, formData.password);
                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: user.id, clinic_id: clinic.id, name: user.name, role: user.role, clinic_name: clinic.clinic_name
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { setError(err.message); setLoading(false); }
            };

            // الدخول السريع
            const handleFastLogin = async (e) => {
                e.preventDefault();
                if (!selectedSavedUser) return;
                if (!fastLoginPassword) return setError("الرجاء إدخال كلمة المرور");

                setLoading(true); setError('');
                try {
                    const { user, clinic } = await window.ClinicQueries.login(selectedSavedUser.phone, fastLoginPassword);
                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: user.id, clinic_id: clinic.id, name: user.name, role: user.role, clinic_name: clinic.clinic_name
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { setError("كلمة المرور غير صحيحة"); setLoading(false); }
            };

            // التسجيل
            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    const { clinicId, userId } = await window.ClinicQueries.createClinic(
                        formData.clinicName, formData.ownerName, formData.phone, formData.password
                    );
                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: userId, clinic_id: clinicId, name: formData.ownerName, role: 'owner', clinic_name: formData.clinicName
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', userId);
                    window.location.replace('dashboard.html');
                } catch (err) { setError(err.message); setLoading(false); }
            };

            // استعادة الحساب
            const handleRecovery = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    if(!recoveryData.key) throw new Error("يرجى إدخال مفتاح الأمان");
                    
                    const cleanedKey = recoveryData.key.trim().toUpperCase();
                    const user = await window.db.users.where('security_key').equals(cleanedKey).first();
                    
                    if (!user) throw new Error("مفتاح الأمان غير صحيح أو غير مسجل.");

                    // تحديث بيانات المستخدم
                    await window.db.users.update(user.id, { 
                        phone: recoveryData.newPhone.trim(), 
                        password: recoveryData.newPassword 
                    });

                    // الدخول مباشرة
                    const clinic = await window.db.clinic_info.toCollection().first();
                    localStorage.setItem('MentraClinics_Session', JSON.stringify({
                        user_id: user.id, clinic_id: clinic.id, name: user.name, role: user.role, clinic_name: clinic.clinic_name
                    }));
                    localStorage.setItem('MentraClinics_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { setError(err.message); setLoading(false); }
            };

            if (isChecking) return null; // يتم التعامل معها عبر شاشة التحميل الأساسية

            return (
                <div className="w-full max-w-[440px] fade-up">
                    
                    {/* الشعار */}
                    <div className="text-center mb-6">
                        <div className="w-16 h-16 bg-gradient-to-br from-[#0284C7] to-[#0EA5E9] mx-auto rounded-2xl flex items-center justify-center text-white text-3xl shadow-[0_10px_30px_rgba(14,165,233,0.3)] mb-4">
                            <i className="fas fa-stethoscope"></i>
                        </div>
                        <h1 className="text-3xl font-black text-white tracking-tight mb-1">Mentra<span className="text-[#0EA5E9]">Clinics</span> <span className="bg-slate-200 text-slate-700 text-[10px] font-black px-1.5 py-0.5 rounded ml-1 align-middle">LITE</span></h1>
                        <span className="inline-block bg-white/10 text-slate-300 backdrop-blur-md border border-white/20 px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase mt-2">
                            <i className="fas fa-shield-alt text-emerald-400 mr-1"></i> Offline Medical Edition
                        </span>
                    </div>

                    {/* الكارت الرئيسي */}
                    <div className="bg-white rounded-[2rem] shadow-2xl overflow-hidden relative border border-slate-100 max-h-[85vh] flex flex-col">
                        
                        {/* التبويبات العلوية */}
                        {['login', 'register'].includes(activeTab) && (
                            <div className="flex p-2 bg-slate-50 border-b border-slate-100 shrink-0">
                                <button onClick={() => {setActiveTab('login'); setError('');}} className={`flex-1 py-3.5 text-sm font-black rounded-xl transition-all duration-300 ${activeTab === 'login' ? 'bg-white text-[#0284C7] shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                    دخول للعيادة
                                </button>
                                <button onClick={() => {setActiveTab('register'); setError('');}} className={`flex-1 py-3.5 text-sm font-black rounded-xl transition-all duration-300 ${activeTab === 'register' ? 'bg-white text-[#0284C7] shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                    تأسيس عيادة جديدة
                                </button>
                            </div>
                        )}

                        {/* رأس تبويب الاستعادة */}
                        {activeTab === 'recovery' && (
                            <div className="p-4 bg-violet-50 border-b border-violet-100 flex items-center justify-between shrink-0">
                                <div className="flex items-center gap-2 text-violet-700">
                                    <i className="fas fa-key text-lg"></i>
                                    <span className="font-black text-sm">استعادة الحساب</span>
                                </div>
                                <button onClick={() => setActiveTab('login')} className="text-violet-400 hover:text-violet-600 text-xs font-bold px-3 py-1.5 bg-white rounded-lg shadow-sm active:scale-95 transition-all">
                                    إلغاء
                                </button>
                            </div>
                        )}

                        {/* منطقة المحتوى (قابلة للتمرير في الموبايل) */}
                        <div className="p-6 sm:p-8 overflow-y-auto custom-scroll flex-1">
                            
                            {error && (
                                <div className="bg-rose-50 border border-rose-200 text-rose-600 p-4 rounded-2xl text-xs font-bold mb-6 flex items-start gap-3 fade-up">
                                    <i className="fas fa-exclamation-circle text-lg mt-0.5"></i>
                                    <span className="leading-relaxed">{error}</span>
                                </div>
                            )}

                            {/* ====== نموذج الدخول السريع ====== */}
                            {activeTab === 'fast-login' && selectedSavedUser && (
                                <form onSubmit={handleFastLogin} className="text-center fade-up space-y-5">
                                    {savedUsers.length > 1 && (
                                        <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2 mb-2 justify-center">
                                            {savedUsers.map(u => (
                                                <button key={u.id} type="button" onClick={() => { setSelectedSavedUser(u); setFastLoginPassword(''); setError(''); }} className={`p-2 rounded-2xl border-2 transition-all shrink-0 w-20 flex flex-col items-center ${selectedSavedUser.id === u.id ? 'border-[#0EA5E9] bg-sky-50/50 scale-105' : 'border-slate-100 bg-white opacity-60 hover:opacity-100'}`}>
                                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black mb-1.5 transition-colors ${selectedSavedUser.id === u.id ? 'bg-[#0284C7] text-white' : 'bg-slate-200 text-slate-500'}`}>{u.name.charAt(0)}</div>
                                                    <p className="text-[10px] font-bold text-slate-700 whitespace-nowrap truncate w-full px-1">{u.role === 'owner' ? 'د.' : ''} {u.name.split(' ')[0]}</p>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="mb-4">
                                        {savedUsers.length === 1 && (
                                            <div className="w-20 h-20 bg-[#0284C7] text-white rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-4 border-4 border-slate-50 shadow-lg">{selectedSavedUser.name.charAt(0)}</div>
                                        )}
                                        <h2 className="text-xl font-black text-slate-800">أهلاً بك، {selectedSavedUser.name.split(' ')[0]}</h2>
                                        <p className="text-sm font-bold text-[#0EA5E9] mt-1"><i className="fas fa-clinic-medical mr-1"></i> {selectedSavedUser.clinic_name}</p>
                                    </div>

                                    <div className="input-group relative text-right">
                                        <input type={showPassword ? "text" : "password"} value={fastLoginPassword} onChange={(e) => setFastLoginPassword(e.target.value)} required dir="ltr" className="input-field text-left placeholder:text-right pr-12" placeholder="أدخل كلمة المرور" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-[#0EA5E9] p-2 focus:outline-none"><i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                    </div>

                                    <button type="submit" disabled={loading} className="w-full bg-[#0284C7] hover:bg-sky-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-sky-700/20 transition-all active:scale-95 flex justify-center items-center gap-2 text-base md:text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <><i className="fas fa-sign-in-alt"></i> تأكيد الدخول</>}
                                    </button>
                                    <button type="button" onClick={() => setActiveTab('login')} className="w-full text-slate-500 hover:text-slate-800 font-bold text-sm transition-colors mt-2 p-2 active:scale-95">الدخول بحساب غير محفوظ</button>
                                </form>
                            )}

                            {/* ====== نموذج الدخول العادي ====== */}
                            {activeTab === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4 fade-up">
                                    <div className="input-group">
                                        <input type="tel" name="phone" value={formData.phone} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right" placeholder="رقم الهاتف" />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group relative">
                                        <input type={showPassword ? "text" : "password"} name="password" value={formData.password} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right pr-12" placeholder="كلمة المرور" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-[#0EA5E9] p-2 focus:outline-none"><i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-[#0284C7] hover:bg-sky-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-sky-700/20 transition-all active:scale-95 mt-4 flex justify-center items-center gap-2 text-base md:text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'دخول للعيادة'}
                                    </button>
                                    
                                    <div className="flex flex-col items-center gap-3 pt-4">
                                        {savedUsers.length > 0 && (
                                            <button type="button" onClick={() => setActiveTab('fast-login')} className="text-slate-500 hover:text-slate-800 font-bold text-sm transition-colors active:scale-95">
                                                <i className="fas fa-bolt text-[#0EA5E9] mr-1"></i> العودة للحسابات المحفوظة
                                            </button>
                                        )}
                                        <button type="button" onClick={() => {setActiveTab('recovery'); setError('');}} className="text-violet-500 hover:text-violet-700 font-bold text-xs transition-colors active:scale-95 bg-violet-50 px-3 py-1.5 rounded-lg">
                                            <i className="fas fa-key mr-1"></i> نسيت كلمة المرور؟
                                        </button>
                                    </div>
                                </form>
                            )}

                            {/* ====== نموذج استعادة الحساب ====== */}
                            {activeTab === 'recovery' && (
                                <form onSubmit={handleRecovery} className="space-y-4 fade-up">
                                    <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl mb-4 text-[11px] md:text-xs font-bold text-amber-700 flex gap-2">
                                        <i className="fas fa-info-circle mt-0.5 shrink-0"></i>
                                        <p>أدخل مفتاح الأمان الخاص بك لتتمكن من تغيير رقم الهاتف (اليوزر) وكلمة المرور والدخول للعيادة مباشرة.</p>
                                    </div>
                                    <div className="input-group">
                                        <input type="text" name="key" value={recoveryData.key} onChange={handleRecoveryChange} required dir="ltr" className="input-field recovery text-center placeholder:text-right uppercase tracking-widest font-black text-violet-700" placeholder="مفتاح الأمان (مثال: A1B2-C3D4)" />
                                        <i className="fas fa-shield-alt input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="tel" name="newPhone" value={recoveryData.newPhone} onChange={handleRecoveryChange} required dir="ltr" className="input-field recovery text-left placeholder:text-right" placeholder="رقم الهاتف الجديد" />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group relative">
                                        <input type={showPassword ? "text" : "password"} name="newPassword" value={recoveryData.newPassword} onChange={handleRecoveryChange} required dir="ltr" className="input-field recovery text-left placeholder:text-right pr-12" placeholder="كلمة المرور الجديدة" minLength="6" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-violet-500 p-2 focus:outline-none"><i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-violet-600 hover:bg-violet-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-violet-500/30 transition-all active:scale-95 mt-4 flex justify-center items-center gap-2 text-base md:text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <><i className="fas fa-check-circle"></i> تحديث ودخول</>}
                                    </button>
                                </form>
                            )}

                            {/* ====== نموذج إنشاء عيادة ====== */}
                            {activeTab === 'register' && (
                                <form onSubmit={handleRegister} className="space-y-4 fade-up">
                                    <div className="input-group">
                                        <input type="text" name="clinicName" value={formData.clinicName} onChange={handleChange} required className="input-field pr-4" placeholder="اسم العيادة / المركز الطبي" />
                                        <i className="fas fa-clinic-medical input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="text" name="ownerName" value={formData.ownerName} onChange={handleChange} required className="input-field pr-4" placeholder="اسم الطبيب المدير" />
                                        <i className="fas fa-user-md input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="tel" name="phone" value={formData.phone} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right" placeholder="رقم الهاتف الأساسي للعيادة" />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group relative">
                                        <input type={showPassword ? "text" : "password"} name="password" value={formData.password} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right pr-12" placeholder="كلمة المرور (6 أحرف على الأقل)" minLength="6" />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-[#0EA5E9] p-2 focus:outline-none"><i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-gradient-to-l from-[#0284C7] to-[#0EA5E9] hover:to-sky-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-sky-500/30 transition-all active:scale-95 mt-4 flex justify-center items-center gap-2 text-base md:text-lg">
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'تأسيس العيادة وبدء العمل'}
                                    </button>
                                </form>
                            )}

                        </div>
                        
                        {/* تذييل البطاقة لحماية الخصوصية */}
                        <div className="bg-slate-50 p-4 text-center border-t border-slate-100 shrink-0">
                            <p className="text-[11px] font-bold text-slate-400 flex items-center justify-center gap-2">
                                <i className="fas fa-lock text-emerald-500"></i> بياناتك مشفرة ومحفوظة محلياً 100%
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SubscriptionsApp />);
    </script>
</body>
</html>
